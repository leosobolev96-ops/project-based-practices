[project]
name = "emotion-calibration"
version = "0.1.0"
description = "Учебный проект по посткалибровке вероятностей классификаторов эмоций"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "joblib>=1.4.0",
    "matplotlib>=3.8.0",
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
]

[project.scripts]
ravdess-convert = "emotion_calibration.convert_ravdess:main"
ravdess-features = "emotion_calibration.extract_features:main"
ravdess-classify = "emotion_calibration.classify:main"
ravdess-calibrate = "emotion_calibration.calibrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_calibration"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
