[project]
name = "emotion-calibration"
version = "0.1.0"
description = "Учебный проект по посткалибровке вероятностей классификаторов эмоций"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
]

[project.scripts]
ravdess-convert = "emotion_calibration.convert_ravdess:main"
ravdess-features = "emotion_calibration.extract_features:main"
ravdess-classify = "emotion_calibration.classify:main"
ravdess-calibrate = "emotion_calibration.calibrate:main"
ravdess-calibrate-compare = "emotion_calibration.calibrate_models_comparison:main"
ravdess-features-extended = "emotion_calibration.extract_features_extended:main"
ravdess-ablation = "emotion_calibration.ablation_features:main"
ravdess-augment = "emotion_calibration.augment_train:main"
ravdess-train-augmented = "emotion_calibration.train_with_augmentation:main"
ravdess-stability = "emotion_calibration.calibration_stability:main"
ravdess-emotion-analysis = "emotion_calibration.emotion_level_analysis:main"
ravdess-subgroups = "emotion_calibration.subgroup_analysis:main"
ravdess-split-robustness = "emotion_calibration.actor_split_robustness:main"
ravdess-verify-dataset = "emotion_calibration.verify_dataset:main"
ravdess-log-experiment = "emotion_calibration.log_experiment:main"
ravdess-train-final = "emotion_calibration.train_final_model:main"
ravdess-predict = "emotion_calibration.predict_single:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_calibration"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
]
